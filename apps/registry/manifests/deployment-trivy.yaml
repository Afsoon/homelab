apiVersion: apps/v1
kind: Deployment
metadata:
  name: trivy-server
  namespace: registry
  labels:
    app: trivy-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trivy-server
  template:
    metadata:
      labels:
        app: trivy-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trivy
          image: aquasec/trivy:0.76.2
          args:
            - server
            - --listen
            - 0.0.0.0:8080
            - --cache-dir
            - /home/trivy/.cache
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: cache
              mountPath: /home/trivy/.cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: trivy-cache
