apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restate-cloud-env-secret
  namespace: restate-operator
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: restate-cloud-env-secret
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: RESTATE_CLOUD_API_KEY
