apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: argocd-webhook
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: github-secret
      remoteRef:
        key: ARGOCD_WEBHOOK_SECRET
