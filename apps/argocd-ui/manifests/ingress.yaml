apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-ui
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.lab.saidatr.dev`)
      kind: Rule
      services:
        - name: argocd-server
          port: 443
          serversTransport: argocd-insecure
