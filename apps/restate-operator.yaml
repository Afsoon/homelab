apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: restate-operator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io
      chart: restatedev/restate-operator-helm
      targetRevision: 3.2.0
      helm:
        releaseName: restate-operator
    - repoURL: https://github.com/Afsoon/homelab.git
      targetRevision: main
      path: apps/restate-operator/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: restate-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxLength: 10m
