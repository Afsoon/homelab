apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canary
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: canary
    creationPolicy: Owner
  data:
    - secretKey: canary
      remoteRef:
        key: CANARY
