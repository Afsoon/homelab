apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    onepasswordSDK:
      environment: REPLACE_WITH_ENV_ID
      auth:
        serviceAccountSecretRef:
          name: onepassword-token
          key: token
